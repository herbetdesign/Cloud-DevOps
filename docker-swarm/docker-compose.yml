version: "3.8"

services:
  app:
    build: .
    environment:
      DB_HOST: db
      DB_USER: root
      DB_PASS: root
      DB_NAME: empresa
    deploy:
      replicas: 3
      restart_policy:
        condition: on-failure
    networks:
      - app_net

  db:
    image: mysql:5.7
    environment:
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - ./banco.sql:/docker-entrypoint-initdb.d/banco.sql
    deploy:
      placement:
        constraints:
          - node.role == manager
    networks:
      - app_net

  nginx:
    image: nginx:latest
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - app
    networks:
      - app_net

networks:
  app_net:
    driver: overlay
